name: Package Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build ("main" = build only)'
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  extension:
    name: Build ${{ matrix.extension.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extension:
          - name: kde
            script: ./scripts/build_kde_embed.sh
            artifact: waywallen-kde
            pattern: build/waywallen-kde-*.zip
            packages: >-
              cmake gettext ninja-build g++ pkg-config
              qt6-base-dev qt6-declarative-dev
              libegl-dev libgles-dev libvulkan-dev
          - name: gnome
            script: ./scripts/build_gnome_zip.sh
            artifact: waywallen-gnome
            pattern: build/waywallen-gnome-*.zip
            packages: >-
              cmake gettext ninja-build g++ pkg-config
              libgtk-4-dev libglib2.0-dev
              gobject-introspection libgirepository1.0-dev
              gir1.2-gtk-4.0
              libvulkan-dev libegl-dev libgles-dev
        platform:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.extension.packages }}

      - name: Build ${{ matrix.extension.name }} extension
        run: ${{ matrix.extension.script }}

      - name: Verify translation assets
        run: |
          archive=$(compgen -G '${{ matrix.extension.pattern }}' | head -n1)
          test -n "$archive"
          entries=$(unzip -Z1 "$archive")
          if [ '${{ matrix.extension.name }}' = kde ]; then
            grep -qx 'org.waywallen.kde/contents/locale/ru/LC_MESSAGES/plasma_wallpaper_org.waywallen.kde.mo' <<<"$entries"
            grep -qx 'org.waywallen.kde/contents/ui/Plugin/qmldir' <<<"$entries"
            grep -qx 'org.waywallen.kde/contents/ui/Plugin/PluginDisplay.qml' <<<"$entries"
            grep -qx 'org.waywallen.kde/contents/ui/Plugin/PluginInfo.qml' <<<"$entries"
            grep -qx 'org.waywallen.kde/contents/ui/Plugin/WaywallenDisplayEmbed/qmldir' <<<"$entries"
            display_wrapper=$(unzip -p "$archive" org.waywallen.kde/contents/ui/Plugin/PluginDisplay.qml)
            info_wrapper=$(unzip -p "$archive" org.waywallen.kde/contents/ui/Plugin/PluginInfo.qml)
            grep -q 'import "WaywallenDisplayEmbed" as WW' <<<"$display_wrapper"
            grep -q 'WW.WaywallenDisplay {}' <<<"$display_wrapper"
            grep -q 'WW.PluginInfo {}' <<<"$info_wrapper"
            if grep -Eq '/(Wrapper|ImportTest|WaywallenSurfaceEmbed)' <<<"$entries"; then
              echo 'KDE source wrapper found in runtime archive' >&2
              exit 1
            fi
          else
            grep -qx 'locale/ru/LC_MESSAGES/waywallen-gnome.mo' <<<"$entries"
          fi
          if grep -Eq '\.(po|pot)$' <<<"$entries"; then
            echo 'source translation catalog found in runtime archive' >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extension.artifact }}-${{ matrix.platform.arch }}
          path: ${{ matrix.extension.pattern }}
          if-no-files-found: error

  layer-shell:
    name: Build layer-shell (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc gettext pkg-config glslang-tools libegl-dev libgles-dev libvulkan-dev

      - name: Build waywallen-layer-shell
        run: cargo build --bin waywallen-layer-shell --release --locked

      - name: Package waywallen-layer-shell
        run: |
          version=$(
            cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "waywallen-display"))'
          )
          arch=$(uname -m)
          root="waywallen-layer-shell-${version}-${arch}"
          mkdir -p "dist/$root"
          install -Dm755 target/release/waywallen-layer-shell "dist/$root/waywallen-layer-shell"
          while IFS= read -r lang; do
            case "$lang" in ''|'#'*) continue ;; esac
            locale_dir="dist/$root/share/locale/$lang/LC_MESSAGES"
            mkdir -p "$locale_dir"
            msgfmt --check --check-format -o "$locale_dir/waywallen-layer-shell.mo" \
              "po/layer-shell/$lang.po"
          done < po/layer-shell/LINGUAS
          tar -C dist -czf "dist/$root.tar.gz" "$root"
          rm -rf "dist/$root"

      - name: Verify translation assets
        run: |
          archive=$(compgen -G 'dist/waywallen-layer-shell-*.tar.gz' | head -n1)
          test -n "$archive"
          entries=$(tar -tzf "$archive")
          grep -Eq '/share/locale/ru/LC_MESSAGES/waywallen-layer-shell.mo$' <<<"$entries"
          if grep -Eq '\.(po|pot)$' <<<"$entries"; then
            echo 'source translation catalog found in runtime archive' >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: waywallen-layer-shell-${{ matrix.platform.arch }}
          path: dist/waywallen-layer-shell-*.tar.gz
          if-no-files-found: error

  create-release:
    name: Create release
    needs:
      - extension
      - layer-shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine release
        id: rel
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          if [ "${{ github.event_name }}" = "push" ] || [[ "$REF" == v* ]]; then
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.rel.outputs.is_release == 'true'
        run: |
          python3 scripts/changelog.py "${{ steps.rel.outputs.tag }}" > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Create release
        if: steps.rel.outputs.is_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.rel.outputs.tag }}
          artifacts: dist/*
          bodyFile: /tmp/changelog.md
          immutableCreate: true
          skipIfReleaseExists: true
